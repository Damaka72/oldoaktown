name: Weekly Newsletter Digest

# Builds "The Old Oak Weekly" from what is already published on the site
# (news, events, videos) and emails a ready-to-send copy to the admin.
# Runs Monday 09:00 UTC, after the daily content jobs (08:00 / 08:30).

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  weekly-edition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-save --no-audit --no-fund @anthropic-ai/sdk nodemailer
        env:
          NODE_AUTH_TOKEN: ''

      - name: Build edition and email it
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node scripts/weekly-edition.js

      - name: Commit edition
        run: |
          git config user.name "Old Oak Town Bot"
          git config user.email "bot@oldoaktown.co.uk"
          git add data/editions/
          git diff --staged --quiet || git commit -m "chore: weekly edition $(date +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push
